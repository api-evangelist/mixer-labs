name: Mixer Labs
description: Mixer Labs was a San Francisco startup, backed by Uncork Capital (formerly SoftTech VC),
  best known for building GeoAPI, a geolocation and geodata web API that let developers resolve places,
  points of interest, and location context from coordinates. The company was acquired by Twitter in
  December 2009, where its technology and team (co-founders Elad Gil and Othman Laraki) went on to power
  Twitter's location and geo features. Mixer Labs no longer operates as an independent company, its
  mixerlabs.com domain no longer resolves, and it publishes no live API, developer portal, or
  documentation surface today. This profile is retained in the API Evangelist network as a historical
  portfolio-company record rather than an active provider awaiting enrichment.
